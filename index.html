<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Tune — Stay in Tune with Yourself</title>
<meta name="description" content="Fine-tune your days. A boutique log for writing, workouts, goals, and notes." />
<meta name="theme-color" content="#1a1a1a" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Tune" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="apple-touch-icon" href="./apple-touch-icon.png" />
<link rel="icon" href="./favicon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
:root {
  --bg: #f7f4ec;
  --bg-soft: #faf7f1;
  --surface: #ffffff;
  --paper: #fffdf8;
  --ink-50:  #f6f2e8;
  --ink-100: #ece7d8;
  --ink-200: #d9d2bf;
  --ink-300: #b4ab94;
  --ink-400: #8a8270;
  --ink-500: #5e5746;
  --ink-600: #3a342a;
  --ink-700: #25211a;
  --ink-800: #16130d;
  --ink-900: #0c0a07;
  --brand: #1f1d1a;
  --brand-soft: #ece7d8;
  --on-ink: var(--on-ink);
  --accent: #4f46e5;
  --accent-soft: #eef2ff;
  --red: #c2410c;
  --shadow-card: 0 1px 0 rgba(15,17,19,0.04), 0 6px 20px rgba(31,29,26,0.04);
  --shadow-pop:  0 1px 0 rgba(15,17,19,0.04), 0 20px 50px rgba(31,29,26,0.10);
  --shadow-fab:  0 12px 30px rgba(15,17,19,0.18);
  --border: 1px solid rgba(37,33,26,0.08);
  --serif: 'Fraunces', 'Times New Roman', Georgia, serif;
  --sans:  'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
}

[data-theme="dark"] {
  --bg: #100d09;
  --bg-soft: #16120c;
  --surface: #1c1812;
  --paper: #221d15;
  --ink-50:  #2b261d;
  --ink-100: #34301f;
  --ink-200: #4a4332;
  --ink-300: #6f6650;
  --ink-400: #968b6e;
  --ink-500: #b7ad8e;
  --ink-600: #d6cdaf;
  --ink-700: #ebe3c8;
  --ink-800: #f5efe0;
  --ink-900: #fdf9ec;
  --brand: #ebe3c8;
  --brand-soft: #2b261d;
  --on-ink: #100d09;
  --accent: #818cf8;
  --accent-soft: rgba(129,140,248,0.16);
  --red: #f97316;
  --shadow-card: 0 1px 0 rgba(0,0,0,0.4), 0 6px 20px rgba(0,0,0,0.18);
  --shadow-pop:  0 1px 0 rgba(0,0,0,0.4), 0 20px 50px rgba(0,0,0,0.50);
  --shadow-fab:  0 12px 30px rgba(0,0,0,0.55);
  --border: 1px solid rgba(245,239,224,0.07);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--sans);
  background: var(--bg);
  color: var(--ink-800);
  min-height: 100vh;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
button { font-family: inherit; cursor: pointer; border: 0; background: none; padding: 0; color: inherit; }
input, textarea { font-family: inherit; }
a { color: inherit; text-decoration: none; }

.app {
  max-width: 480px;
  margin: 0 auto;
  min-height: 100vh;
  padding-bottom: 110px;
  position: relative;
}

/* TYPOGRAPHY HELPERS */
.serif { font-family: var(--serif); font-feature-settings: "ss01"; }
.serif-i { font-family: var(--serif); font-style: italic; font-feature-settings: "ss01"; }

/* MASTHEAD — editorial header */
.masthead {
  padding: 22px 22px 0;
  display: flex; align-items: center; justify-content: space-between;
}
.brand {
  font-family: var(--serif); font-style: italic; font-weight: 500;
  font-size: 24px; letter-spacing: -0.02em;
  color: var(--ink-800);
  line-height: 1;
}
.brand::after { content: '.'; color: var(--accent); margin-left: -0.04em; }
.masthead__right { display: flex; gap: 8px; align-items: center; }

/* HEADER (page header for inner pages) */
.header {
  padding: 22px 22px 12px;
  display: flex; justify-content: space-between; align-items: flex-start;
  gap: 12px;
}
.header__title {
  font-family: var(--serif); font-weight: 500;
  font-size: 32px; line-height: 1.05; letter-spacing: -0.025em;
  margin: 0; color: var(--ink-800);
}
.header__subtitle { font-size: 13px; color: var(--ink-500); margin: 6px 0 0; font-weight: 500; }
.header__group { display: flex; align-items: center; gap: 6px; min-width: 0; }
.header__back {
  width: 36px; height: 36px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  color: var(--ink-600); margin-left: -8px;
}
.header__back:hover { background: var(--ink-100); }
.header__right { display: flex; gap: 8px; align-items: center; flex-shrink: 0; }

/* BIG DATE on home */
.date-block { padding: 0 22px; }
.date-block__day {
  font-family: var(--serif); font-weight: 400;
  font-size: 60px; line-height: 0.95; letter-spacing: -0.04em;
  color: var(--ink-800);
  margin: 18px 0 6px;
}
.date-block__day em { font-style: italic; font-weight: 400; }
.date-block__sub {
  font-size: 13px; color: var(--ink-500);
  letter-spacing: 0.01em; font-weight: 500;
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
}
.dot { width: 3px; height: 3px; border-radius: 50%; background: var(--ink-300); display: inline-block; }
.streak-pill {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 3px 9px; border-radius: 999px;
  background: var(--ink-800); color: var(--on-ink);
  font-size: 11px; font-weight: 600; letter-spacing: 0.02em;
}
.streak-pill svg { color: #f97316; }

/* HERO NUMBER — the screenshot moment */
.hero {
  padding: 14px 22px 4px;
}
.hero__eyebrow {
  font-size: 11px; font-weight: 600;
  letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--ink-400);
  margin: 0 0 8px;
}
.hero__row {
  display: flex; align-items: baseline; gap: 14px;
  margin: 0;
}
.hero__num {
  font-family: var(--serif);
  font-style: italic; font-weight: 400;
  font-size: 132px; line-height: 0.88;
  letter-spacing: -0.055em;
  color: var(--ink-800);
  font-variant-numeric: tabular-nums;
  display: inline-block;
  transition: color 0.2s;
}
.hero__unit {
  font-family: var(--serif);
  font-style: italic; font-weight: 400;
  font-size: 28px; line-height: 1;
  letter-spacing: -0.02em;
  color: var(--ink-500);
}
.hero__sub {
  margin: 14px 0 0;
  font-size: 12px; font-weight: 500;
  color: var(--ink-500);
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
}

@media (max-width: 360px) {
  .hero__num { font-size: 104px; }
  .hero__unit { font-size: 22px; }
}

/* TILE ANIMATION — pulse on number change */
@keyframes numPop {
  0%   { transform: scale(1); }
  40%  { transform: scale(1.18); }
  100% { transform: scale(1); }
}
.num-pop { animation: numPop 0.35s cubic-bezier(0.34, 1.56, 0.64, 1); transform-origin: left center; display: inline-block; }

/* FOCUS MODE — full-screen single-color session */
.focus {
  position: fixed; inset: 0; z-index: 100;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  color: #fdfbf6;
  padding: 24px;
  animation: focusIn 0.35s cubic-bezier(0.22, 1, 0.36, 1);
  text-align: center;
}
.focus::before {
  content: ''; position: absolute; inset: 0;
  background: radial-gradient(120% 80% at 50% 0%, rgba(255,255,255,0.18), transparent 60%),
              radial-gradient(140% 100% at 50% 100%, rgba(0,0,0,0.22), transparent 60%);
  pointer-events: none;
}
.focus__inner { position: relative; display: flex; flex-direction: column; align-items: center; }
.focus__cat {
  font-size: 12px; letter-spacing: 0.2em;
  text-transform: uppercase; font-weight: 600;
  opacity: 0.85;
  margin: 0 0 24px;
  display: flex; align-items: center; gap: 10px;
}
.focus__cat-dot { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,0.6); }
.focus__time {
  font-family: var(--serif);
  font-style: italic; font-weight: 300;
  font-size: 108px; line-height: 1;
  letter-spacing: -0.04em;
  font-variant-numeric: tabular-nums;
  margin: 0;
}
.focus__hint {
  font-size: 12px; letter-spacing: 0.08em;
  opacity: 0.6; margin: 28px 0 0;
}
.focus__actions { display: flex; gap: 10px; margin-top: 36px; }
.focus__btn {
  padding: 14px 28px; border-radius: 999px;
  font-weight: 600; font-size: 14px;
  background: rgba(255,255,255,0.16); color: #fdfbf6;
  -webkit-backdrop-filter: blur(10px);
  backdrop-filter: blur(10px);
  transition: transform 0.12s, background 0.15s;
  letter-spacing: -0.005em;
}
.focus__btn:hover { background: rgba(255,255,255,0.24); }
.focus__btn:active { transform: scale(0.96); }
.focus__btn--primary { background: #fdfbf6; color: var(--ink-900); }
.focus__btn--primary:hover { background: white; }
@keyframes focusIn {
  from { opacity: 0; transform: scale(0.96); filter: blur(6px); }
  to   { opacity: 1; transform: scale(1); filter: blur(0); }
}

/* CARDS */
.card {
  background: var(--surface);
  border: var(--border);
  border-radius: 18px;
  box-shadow: var(--shadow-card);
  padding: 16px;
}

/* BUTTONS */
.btn { display: inline-flex; align-items: center; gap: 8px; padding: 14px 22px; border-radius: 14px; font-weight: 600; font-size: 14px; transition: transform 0.12s, background 0.15s; letter-spacing: -0.005em; }
.btn:active { transform: scale(0.97); }
.btn-primary { background: var(--ink-800); color: var(--on-ink); }
.btn-primary:hover { background: var(--ink-900); }
.btn-secondary { background: var(--ink-100); color: var(--ink-700); }
.btn-ghost { color: var(--accent); font-weight: 600; }
.btn-danger { color: var(--red); }

.btn-circle {
  width: 38px; height: 38px; border-radius: 50%;
  background: var(--ink-800); color: var(--on-ink);
  display: flex; align-items: center; justify-content: center;
  transition: transform 0.12s, background 0.15s;
}
.btn-circle:active { transform: scale(0.94); }
.btn-circle--ghost {
  background: transparent;
  color: var(--ink-700);
  border: var(--border);
}
.btn-circle--ghost:hover { background: var(--ink-50); }

/* SECTION */
.section { padding: 0 22px; margin-top: 28px; }
.section__head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 14px; }
.section__title {
  font-family: var(--serif); font-weight: 500;
  font-size: 16px; letter-spacing: -0.01em;
  color: var(--ink-700); margin: 0;
}
.section__title em { font-style: italic; font-weight: 400; color: var(--ink-600); }
.section__link {
  font-size: 12px; font-weight: 600; color: var(--ink-500);
  display: inline-flex; align-items: center; gap: 4px;
  transition: color 0.15s;
}
.section__link:hover { color: var(--ink-800); }

/* CATEGORY TILE — premium one-tap */
.tiles { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }

.tile {
  position: relative;
  background: var(--paper);
  border: var(--border);
  border-radius: 22px;
  padding: 18px 16px 16px;
  text-align: left;
  width: 100%;
  min-height: 132px;
  display: flex; flex-direction: column; justify-content: space-between;
  transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.2s;
  box-shadow: var(--shadow-card);
  overflow: hidden;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
}
.tile:active { transform: scale(0.96); }
.tile.pulse { animation: tilePulse 0.6s cubic-bezier(0.22, 1, 0.36, 1); }
@keyframes tilePulse {
  0%   { transform: scale(1); }
  20%  { transform: scale(0.96); }
  50%  { transform: scale(1.03); }
  100% { transform: scale(1); }
}
.tile__icon {
  width: 38px; height: 38px;
  border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
}
.tile__name {
  font-family: var(--serif); font-weight: 500;
  font-size: 19px; letter-spacing: -0.02em;
  color: var(--ink-800); margin: 12px 0 0;
}
.tile__value {
  display: flex; align-items: baseline; gap: 4px;
  margin-top: 4px;
}
.tile__num {
  font-family: var(--serif); font-weight: 400;
  font-size: 22px; letter-spacing: -0.02em;
  color: var(--ink-700);
}
.tile__unit {
  font-size: 11px; color: var(--ink-400); font-weight: 500;
  text-transform: lowercase;
}
.tile__sub {
  font-size: 11px; color: var(--ink-400);
  margin: 4px 0 0; font-weight: 500;
  letter-spacing: 0.01em;
}
.tile__more {
  position: absolute; top: 10px; right: 10px;
  width: 28px; height: 28px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  color: var(--ink-300);
  opacity: 0;
  transition: opacity 0.15s, background 0.15s, color 0.15s;
}
.tile:hover .tile__more, .tile.show-more .tile__more { opacity: 1; }
.tile__more:hover { background: var(--ink-100); color: var(--ink-700); }
.tile__count {
  position: absolute; bottom: 14px; right: 14px;
  background: var(--ink-100);
  color: var(--ink-600);
  font-size: 10px; font-weight: 700;
  border-radius: 999px;
  padding: 2px 7px;
}

/* ENTRY ROW — refined */
.entry {
  display: flex; align-items: center; gap: 14px;
  background: var(--surface);
  border: var(--border);
  border-radius: 16px;
  padding: 14px;
  position: relative;
}
.entry__icon {
  width: 38px; height: 38px; border-radius: 11px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.entry__body { flex: 1; min-width: 0; }
.entry__name { font-weight: 600; font-size: 14px; color: var(--ink-800); margin: 0; letter-spacing: -0.01em; }
.entry__note { font-size: 13px; color: var(--ink-500); margin: 2px 0 0; white-space: pre-wrap; line-height: 1.4; }
.entry__value {
  text-align: right; flex-shrink: 0;
}
.entry__value-num {
  font-family: var(--serif); font-weight: 500;
  font-size: 18px; letter-spacing: -0.02em;
  color: var(--ink-800); display: block; line-height: 1;
}
.entry__value-unit {
  font-size: 10px; color: var(--ink-400);
  text-transform: lowercase; letter-spacing: 0.04em;
  margin-top: 2px;
}
.entry__time {
  font-size: 10px; color: var(--ink-400); font-weight: 500;
  display: block; margin-top: 2px;
}
.entry__delete {
  opacity: 0; transition: opacity 0.15s;
  width: 30px; height: 30px;
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  color: var(--ink-300); margin-left: 4px;
}
.entry:hover .entry__delete { opacity: 1; }
.entry__delete:hover { background: #fef2f2; color: var(--red); }

/* GOAL ROW */
.goal {
  background: var(--surface);
  border: var(--border);
  border-radius: 18px;
  padding: 16px;
  display: flex; gap: 14px;
}
.goal__icon {
  width: 38px; height: 38px; border-radius: 11px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.goal__body { flex: 1; min-width: 0; }
.goal__head { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.goal__title {
  font-family: var(--serif); font-weight: 500;
  font-size: 17px; letter-spacing: -0.015em;
  color: var(--ink-800); margin: 0;
}
.goal__sub { font-size: 12px; color: var(--ink-500); margin: 3px 0 0; font-weight: 500; }
.goal__pct {
  font-family: var(--serif); font-weight: 500;
  font-size: 16px; flex-shrink: 0; letter-spacing: -0.02em;
}
.bar { height: 6px; background: var(--ink-100); border-radius: 999px; overflow: hidden; margin-top: 14px; }
.bar__fill { height: 100%; border-radius: 999px; transition: width 0.6s cubic-bezier(0.22, 1, 0.36, 1); }
.goal__actions { margin-top: 12px; display: flex; gap: 16px; font-size: 12px; }
.goal__actions button { font-weight: 600; }

/* NOTE CARD */
.note {
  background: var(--paper);
  border: var(--border);
  border-radius: 18px;
  padding: 16px;
  display: flex; gap: 12px;
  cursor: pointer;
  transition: transform 0.12s, box-shadow 0.2s;
  box-shadow: var(--shadow-card);
}
.note:active { transform: scale(0.99); }
.note__body { flex: 1; min-width: 0; }
.note__title-row { display: flex; align-items: center; gap: 6px; }
.note__title {
  font-family: var(--serif); font-weight: 500;
  font-size: 17px; letter-spacing: -0.015em;
  color: var(--ink-800); margin: 0;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.note__excerpt {
  font-size: 13px; color: var(--ink-500); margin: 6px 0 0;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  overflow: hidden; white-space: pre-wrap; line-height: 1.5;
}
.note__time { font-size: 10px; color: var(--ink-400); margin: 10px 0 0; font-weight: 500; letter-spacing: 0.02em; }
.note__pin {
  width: 30px; height: 30px; border-radius: 8px; color: var(--ink-300);
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.note__pin:hover { color: var(--accent); }

/* INPUTS */
.label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-500); display: block; }
.label small { color: var(--ink-300); font-weight: 400; text-transform: none; letter-spacing: 0; }
.input, .textarea, .select {
  margin-top: 8px;
  width: 100%;
  background: var(--ink-50);
  border: 1px solid transparent;
  border-radius: 14px;
  padding: 13px 16px;
  font-size: 16px;
  color: var(--ink-800);
  outline: none;
  transition: background 0.15s, border 0.15s;
}
.input:focus, .textarea:focus, .select:focus { background: var(--surface); border-color: var(--ink-200); }
.input--big {
  font-family: var(--serif); font-weight: 500;
  font-size: 28px; letter-spacing: -0.02em;
}
.textarea { resize: none; }
.search-wrap { position: relative; }
.search-wrap .icon-abs { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--ink-400); }
.search-wrap input { padding-left: 44px; background: var(--surface); border: var(--border); margin-top: 0; }

/* CHIPS */
.chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
.chips--scroll { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
.chips--scroll::-webkit-scrollbar { display: none; }
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 8px 14px; border-radius: 999px;
  font-size: 13px; font-weight: 600;
  border: var(--border);
  background: var(--surface); color: var(--ink-700);
  flex-shrink: 0;
  transition: transform 0.1s;
  letter-spacing: -0.005em;
}
.chip:active { transform: scale(0.96); }
.chip--active { border-color: transparent; color: var(--on-ink); }

/* MODAL */
.modal-backdrop {
  position: fixed; inset: 0;
  background: rgba(15,16,18,0.32);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  display: flex; align-items: flex-end; justify-content: center;
  z-index: 50;
  animation: fadeIn 0.2s ease-out;
}
.modal {
  background: var(--bg-soft);
  width: 100%;
  max-width: 480px;
  border-radius: 28px 28px 0 0;
  max-height: 90vh;
  display: flex; flex-direction: column;
  animation: slideUp 0.32s cubic-bezier(0.22, 1, 0.36, 1);
  box-shadow: var(--shadow-pop);
}
@media (min-width: 540px) {
  .modal-backdrop { align-items: center; padding: 16px; }
  .modal { border-radius: 28px; max-height: 80vh; }
}
.modal__head {
  display: flex; justify-content: space-between; align-items: center;
  padding: 22px 22px 8px;
}
.modal__title {
  font-family: var(--serif); font-weight: 500;
  font-size: 22px; letter-spacing: -0.02em;
  color: var(--ink-800); margin: 0;
}
.modal__close {
  width: 36px; height: 36px; border-radius: 50%;
  background: var(--ink-100); color: var(--ink-600);
  display: flex; align-items: center; justify-content: center;
}
.modal__body { padding: 0 22px 24px; overflow-y: auto; }
.modal__field { margin-top: 20px; }
.modal__field:first-child { margin-top: 0; }
.modal__row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.modal__footer { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 12px; padding-top: 16px; border-top: var(--border); }

@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes slideUp { from { transform: translateY(40px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

/* EMPTY */
.empty {
  background: var(--paper);
  border: var(--border);
  border-radius: 22px;
  padding: 36px 24px;
  text-align: center;
}
.empty__icon {
  width: 52px; height: 52px;
  border-radius: 14px;
  background: var(--ink-100);
  color: var(--ink-700);
  display: flex; align-items: center; justify-content: center;
  margin: 0 auto 14px;
}
.empty__title {
  font-family: var(--serif); font-weight: 500;
  font-size: 18px; color: var(--ink-800); margin: 0; letter-spacing: -0.01em;
}
.empty__text { font-size: 13px; color: var(--ink-500); margin: 6px 0 0; line-height: 1.5; }

/* FAB */
.fab {
  position: fixed;
  bottom: 96px;
  right: 18px;
  width: 56px; height: 56px;
  border-radius: 50%;
  background: var(--ink-800); color: var(--on-ink);
  display: flex; align-items: center; justify-content: center;
  box-shadow: var(--shadow-fab);
  z-index: 30;
  transition: transform 0.15s;
  animation: fabIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) backwards;
}
.fab:active { transform: scale(0.92); }
@media (min-width: 540px) { .fab { right: calc(50% - 222px); } }
@keyframes fabIn { from { transform: scale(0.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }

/* BOTTOM NAV */
.nav {
  position: fixed;
  bottom: 0; left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 480px;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  -webkit-backdrop-filter: saturate(180%) blur(20px);
  backdrop-filter: saturate(180%) blur(20px);
  border-top: var(--border);
  z-index: 40;
  padding-bottom: env(safe-area-inset-bottom, 0);
}
.nav__inner { display: flex; justify-content: space-around; padding: 10px 8px 6px; }
.nav__item {
  display: flex; flex-direction: column; align-items: center;
  gap: 4px;
  padding: 4px 16px;
  color: var(--ink-400);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.02em;
  position: relative;
  transition: color 0.15s;
}
.nav__item--active { color: var(--ink-800); }
.nav__item--active::after {
  content: '';
  position: absolute;
  bottom: -4px;
  left: 50%;
  transform: translateX(-50%);
  width: 16px; height: 2px;
  background: var(--ink-800);
  border-radius: 2px;
}

/* TOAST */
.toast-wrap {
  position: fixed;
  bottom: 100px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 60;
  pointer-events: none;
  width: 100%;
  max-width: 460px;
  padding: 0 14px;
  display: flex; justify-content: center;
}
.toast {
  pointer-events: auto;
  background: var(--ink-800);
  color: var(--on-ink);
  border-radius: 14px;
  padding: 12px 14px 12px 16px;
  display: flex; align-items: center; gap: 14px;
  box-shadow: var(--shadow-pop);
  font-size: 13px;
  font-weight: 500;
  animation: toastIn 0.36s cubic-bezier(0.22, 1, 0.36, 1);
  max-width: 100%;
}
.toast.out { animation: toastOut 0.28s ease-in forwards; }
.toast__dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.toast__msg { flex: 1; min-width: 0; }
.toast__msg strong { font-weight: 600; color: var(--on-ink); }
.toast__msg span { color: rgba(253,251,246,0.7); }
.toast__action {
  padding: 6px 10px;
  background: rgba(255,255,255,0.1);
  border-radius: 8px;
  color: var(--on-ink);
  font-weight: 600;
  font-size: 12px;
  transition: background 0.15s;
  flex-shrink: 0;
}
.toast__action:hover { background: rgba(255,255,255,0.2); }
@keyframes toastIn {
  from { opacity: 0; transform: translateY(20px); }
  to   { opacity: 1; transform: translateY(0); }
}
@keyframes toastOut {
  from { opacity: 1; transform: translateY(0); }
  to   { opacity: 0; transform: translateY(20px); }
}

/* SWATCHES */
.swatches { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
.swatch {
  width: 36px; height: 36px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  transition: transform 0.1s;
}
.swatch:active { transform: scale(0.9); }

/* ICON GRID */
.icongrid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 8px; margin-top: 8px; }
.icongrid button {
  aspect-ratio: 1;
  border-radius: 12px;
  background: var(--ink-50);
  color: var(--ink-600);
  display: flex; align-items: center; justify-content: center;
  transition: transform 0.1s;
}
.icongrid button:active { transform: scale(0.92); }
.icongrid button.active { color: var(--on-ink); }

/* TOGGLE */
.toggle-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
.toggle-grid button, .period-grid button {
  padding: 12px; border-radius: 14px;
  background: var(--ink-50); color: var(--ink-600);
  font-weight: 600; font-size: 14px;
  letter-spacing: -0.005em;
  transition: background 0.15s, color 0.15s;
}
.toggle-grid button.active, .period-grid button.active {
  background: var(--ink-800); color: var(--on-ink);
}
.period-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px; }

/* PREVIEW */
.preview {
  display: flex; gap: 14px; align-items: center;
  background: var(--paper);
  padding: 16px;
  border-radius: 18px;
  border: var(--border);
}
.preview__icon {
  width: 48px; height: 48px; border-radius: 14px;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.preview__name {
  font-family: var(--serif); font-weight: 500;
  font-size: 18px; letter-spacing: -0.015em;
  color: var(--ink-800); margin: 0;
}
.preview__sub { font-size: 12px; color: var(--ink-500); margin: 3px 0 0; }

/* DASHED ADD */
.dashed-add {
  display: flex; align-items: center; justify-content: center;
  gap: 8px; width: 100%; margin-top: 16px;
  padding: 14px; border-radius: 16px;
  border: 1.5px dashed var(--ink-200);
  color: var(--ink-500); font-weight: 600; font-size: 13px;
  transition: border-color 0.15s, color 0.15s;
}
.dashed-add:hover { border-color: var(--ink-400); color: var(--ink-800); }

/* DATE HEADER (log timeline) */
.date-h {
  font-family: var(--serif); font-weight: 500; font-style: italic;
  font-size: 14px; letter-spacing: -0.005em;
  color: var(--ink-500);
  padding: 0 4px; margin-bottom: 10px;
}
.date-group + .date-group { margin-top: 24px; }

.icon-flex { display: inline-flex; vertical-align: middle; }

/* CAT LIST */
.cat-list-item {
  display: flex; align-items: center; gap: 14px;
  background: var(--surface);
  border: var(--border);
  border-radius: 16px;
  padding: 14px 16px;
  width: 100%;
  text-align: left;
  cursor: pointer;
  transition: transform 0.1s;
}
.cat-list-item:active { transform: scale(0.99); }
.cat-list-item__icon { width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.cat-list-item__body { flex: 1; min-width: 0; }
.cat-list-item__name { font-weight: 600; color: var(--ink-800); font-size: 14px; margin: 0; letter-spacing: -0.01em; }
.cat-list-item__sub { font-size: 12px; color: var(--ink-500); margin: 2px 0 0; }
.cat-list-item__chev { color: var(--ink-300); flex-shrink: 0; }

.stack > * + * { margin-top: 12px; }
.stack-tight > * + * { margin-top: 8px; }
.stack-loose > * + * { margin-top: 20px; }

/* INTRO HINT — shown until first log */
.hint {
  display: flex; align-items: flex-start; gap: 10px;
  background: var(--ink-50);
  border-radius: 14px;
  padding: 12px 14px;
  font-size: 12px;
  color: var(--ink-600);
  line-height: 1.5;
  margin-top: 12px;
}
.hint svg { color: var(--ink-400); flex-shrink: 0; margin-top: 1px; }

/* HEATMAP — GitHub-style activity grid */
.heatmap {
  display: grid;
  grid-template-rows: repeat(7, 1fr);
  grid-auto-flow: column;
  grid-auto-columns: 1fr;
  gap: 5px;
  padding: 4px 0;
}
.heatmap__cell {
  aspect-ratio: 1;
  border-radius: 5px;
  background: var(--ink-50);
  transition: background 0.2s;
  position: relative;
}
.heatmap__cell[data-level="0"] { background: var(--ink-50); }
.heatmap__cell[data-level="1"] { background: color-mix(in srgb, var(--accent) 18%, var(--ink-50)); }
.heatmap__cell[data-level="2"] { background: color-mix(in srgb, var(--accent) 38%, var(--ink-50)); }
.heatmap__cell[data-level="3"] { background: color-mix(in srgb, var(--accent) 65%, var(--ink-50)); }
.heatmap__cell[data-level="4"] { background: var(--accent); }
.heatmap__cell[data-today="1"]::after {
  content: ''; position: absolute; inset: -3px;
  border-radius: 7px; border: 1.5px solid var(--ink-800);
  pointer-events: none;
}
.heatmap__cell[data-future="1"] { background: transparent; border: 1px dashed var(--ink-200); }
.heatmap__legend {
  display: flex; align-items: center; gap: 6px;
  font-size: 10px; color: var(--ink-400);
  font-weight: 500; letter-spacing: 0.02em;
  margin-top: 10px;
}
.heatmap__legend-cells { display: flex; gap: 3px; }
.heatmap__legend-cell { width: 9px; height: 9px; border-radius: 2px; }

/* SETTINGS PAGE */
.setting-section { margin-top: 24px; }
.setting-section + .setting-section { margin-top: 28px; }
.setting-section__title {
  font-family: var(--serif); font-weight: 500; font-style: italic;
  font-size: 13px; letter-spacing: -0.005em;
  color: var(--ink-500);
  margin: 0 0 8px 4px;
  text-transform: lowercase;
}
.setting-group {
  background: var(--surface);
  border: var(--border);
  border-radius: 16px;
  overflow: hidden;
}
.setting-row {
  display: flex; align-items: center; gap: 14px;
  padding: 14px 16px;
  width: 100%;
  background: transparent;
  text-align: left;
  border: 0; cursor: pointer;
  transition: background 0.15s;
}
.setting-row + .setting-row { border-top: var(--border); }
.setting-row:hover { background: var(--ink-50); }
.setting-row__label {
  flex: 1; min-width: 0;
  font-size: 14px; font-weight: 500;
  color: var(--ink-800);
}
.setting-row__sub {
  font-size: 12px; color: var(--ink-500);
  font-weight: 400; margin-top: 2px;
}
.setting-row__value {
  font-size: 13px; color: var(--ink-500);
  display: flex; align-items: center; gap: 6px;
  flex-shrink: 0;
}
.setting-row__chev { color: var(--ink-300); flex-shrink: 0; }

.seg {
  display: inline-flex;
  background: var(--ink-50);
  padding: 3px;
  border-radius: 12px;
  gap: 2px;
}
.seg__btn {
  padding: 7px 12px;
  border-radius: 9px;
  font-size: 12px;
  font-weight: 600;
  color: var(--ink-500);
  transition: all 0.15s;
}
.seg__btn--active {
  background: var(--surface);
  color: var(--ink-800);
  box-shadow: 0 1px 2px rgba(0,0,0,0.08);
}

.name-input {
  display: block; width: 100%;
  font-family: var(--sans);
  background: transparent;
  border: 0; outline: none;
  font-size: 14px; color: var(--ink-800);
  padding: 0;
}
.name-input::placeholder { color: var(--ink-400); }

/* CATEGORY REORDER */
.cat-list-item__reorder {
  display: flex; flex-direction: column;
  margin-right: -8px;
}
.cat-list-item__reorder button {
  width: 30px; height: 22px;
  display: flex; align-items: center; justify-content: center;
  color: var(--ink-300);
  border-radius: 6px;
  transition: background 0.15s, color 0.15s;
}
.cat-list-item__reorder button:hover { background: var(--ink-100); color: var(--ink-700); }
.cat-list-item__reorder button:disabled { opacity: 0.3; cursor: not-allowed; }

/* FILE INPUT (hidden, triggered programmatically) */
.hidden-file { position: absolute; left: -9999px; opacity: 0; }
</style>

/* ============================================================
   HELPERS
   ============================================================ */
function uid() { return Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4); }
function todayISO() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function startOfPeriod(period) {
  const d = new Date(); d.setHours(0,0,0,0);
  if (period === 'day') return d;
  if (period === 'week') {
    const day = d.getDay();
    d.setDate(d.getDate() - ((day + 6) % 7));
    return d;
  }
  d.setDate(1);
  return d;
}
function escapeHTML(s) {
  if (s == null) return '';
  return String(s).replace(/[&<>"']/g, function(c){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]); });
}
function alpha(hex, a) { return hex + Math.round(a*255).toString(16).padStart(2,'0'); }

function formatDateHeader(iso) {
  const d = new Date(iso + 'T00:00:00');
  const today = new Date(); today.setHours(0,0,0,0);
  const yest = new Date(today); yest.setDate(yest.getDate()-1);
  if (d.getTime() === today.getTime()) return 'Today';
  if (d.getTime() === yest.getTime())  return 'Yesterday';
  return d.toLocaleDateString(undefined, { weekday:'short', month:'long', day:'numeric' });
}
function formatTime(iso) {
  const d = new Date(iso);
  const today = new Date();
  if (d.toDateString() === today.toDateString()) {
    return d.toLocaleTimeString(undefined, { hour:'numeric', minute:'2-digit' });
  }
  return d.toLocaleDateString(undefined, { month:'short', day:'numeric' });
}
function timeOfDay(iso) {
  const d = new Date(iso);
  return d.toLocaleTimeString(undefined, { hour:'numeric', minute:'2-digit' });
}
function greetingSerif() {
  const d = new Date();
  const weekday = d.toLocaleDateString(undefined, { weekday:'long' });
  return weekday;
}
function timeGreeting() {
  const h = new Date().getHours();
  if (h < 5)  return 'Late night';
  if (h < 12) return 'Good morning';
  if (h < 17) return 'Good afternoon';
  if (h < 22) return 'Good evening';
  return 'Late night';
}
function personalGreeting() {
  const name = ((STATE.data.profile && STATE.data.profile.name) || '').trim();
  const tg = timeGreeting();
  return name ? (tg + ', ' + name) : tg;
}
function dateSubtitle() {
  return new Date().toLocaleDateString(undefined, { month:'long', day:'numeric', year:'numeric' });
}

function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return { profile: DEFAULT_PROFILE, categories: DEFAULT_CATEGORIES, entries: [], goals: [], notes: [] };
    const p = JSON.parse(raw);
    return {
      profile:    Object.assign({}, DEFAULT_PROFILE, p.profile || {}),
      categories: (p.categories && p.categories.length) ? p.categories : DEFAULT_CATEGORIES,
      entries:    p.entries || [],
      goals:      p.goals   || [],
      notes:      p.notes   || [],
    };
  } catch(e) {
    return { profile: DEFAULT_PROFILE, categories: DEFAULT_CATEGORIES, entries: [], goals: [], notes: [] };
  }
}

function applyTheme() {
  const t = (STATE.data.profile && STATE.data.profile.theme) || 'auto';
  let dark = false;
  if (t === 'dark') dark = true;
  else if (t === 'auto') dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  // also tweak the iOS theme-color meta so the status bar matches
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', dark ? '#100d09' : '#f7f4ec');
}

function progressForGoal(goal) {
  const since = startOfPeriod(goal.period).getTime();
  return STATE.data.entries.reduce(function(sum, e) {
    if (goal.categoryId && e.categoryId !== goal.categoryId) return sum;
    if (new Date(e.date + 'T00:00:00').getTime() < since) return sum;
    return sum + (e.value || 0);
  }, 0);
}
function streakDays() {
  if (!STATE.data.entries.length) return 0;
  const dates = new Set(STATE.data.entries.map(function(e){ return e.date; }));
  let count = 0;
  const d = new Date();
  while (true) {
    const iso = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
    if (dates.has(iso)) {
      count++; d.setDate(d.getDate() - 1);
    } else if (count === 0 && iso === todayISO()) {
      d.setDate(d.getDate() - 1);
    } else break;
  }
  return count;
}
function findCategory(id) { return STATE.data.categories.find(function(c){ return c.id === id; }); }

function todayTotalsByCat() {
  const map = {};
  STATE.data.entries.forEach(function(e) {
    if (e.date === todayISO()) {
      if (!map[e.categoryId]) map[e.categoryId] = { total: 0, count: 0 };
      map[e.categoryId].count++;
      map[e.categoryId].total += (e.value || 0);
    }
  });
  return map;
}

function heatmap() {
  const weeks = 6;
  const today = new Date(); today.setHours(0,0,0,0);
  const todayMS = today.getTime();
  const dayOfWeek = today.getDay(); // 0 = Sun
  const start = new Date(today);
  start.setDate(today.getDate() - dayOfWeek - (weeks - 1) * 7);

  const counts = {};
  STATE.data.entries.forEach(function(e){
    counts[e.date] = (counts[e.date]||0) + 1;
  });

  function levelFor(n) {
    if (n <= 0) return 0;
    if (n === 1) return 1;
    if (n === 2) return 2;
    if (n <= 4) return 3;
    return 4;
  }

  let cells = '';
  for (let w = 0; w < weeks; w++) {
    for (let d = 0; d < 7; d++) {
      const date = new Date(start);
      date.setDate(start.getDate() + w * 7 + d);
      const iso = date.getFullYear() + '-' + String(date.getMonth()+1).padStart(2,'0') + '-' + String(date.getDate()).padStart(2,'0');
      const ms = date.getTime();
      const future = ms > todayMS ? '1' : '';
      const istoday = ms === todayMS ? '1' : '';
      const n = counts[iso] || 0;
      const level = future ? '' : levelFor(n);
      cells += '<div class="heatmap__cell" data-level="' + level + '" data-future="' + future + '" data-today="' + istoday + '" title="' + iso + ' · ' + n + ' entr' + (n === 1 ? 'y' : 'ies') + '"></div>';
    }
  }

  const totalDays = Object.keys(counts).length;
  const totalEntries = STATE.data.entries.length;
  const monthLabel = today.toLocaleDateString(undefined, { month:'long' });

  return '<section class="section">' +
    '<div class="section__head">' +
      '<h2 class="section__title"><em>Last six</em> weeks</h2>' +
      '<span class="section__link" style="color:var(--ink-400);cursor:default">' + totalDays + ' active days</span>' +
    '</div>' +
    '<div class="card" style="background:var(--paper);padding:18px">' +
      '<div class="heatmap">' + cells + '</div>' +
      '<div class="heatmap__legend"><span>less</span><div class="heatmap__legend-cells">' +
        '<div class="heatmap__legend-cell" style="background:var(--ink-50)"></div>' +
        '<div class="heatmap__legend-cell" style="background:color-mix(in srgb, var(--accent) 18%, var(--ink-50))"></div>' +
        '<div class="heatmap__legend-cell" style="background:color-mix(in srgb, var(--accent) 38%, var(--ink-50))"></div>' +
        '<div class="heatmap__legend-cell" style="background:color-mix(in srgb, var(--accent) 65%, var(--ink-50))"></div>' +
        '<div class="heatmap__legend-cell" style="background:var(--accent)"></div>' +
      '</div><span>more</span><span style="margin-left:auto">' + totalEntries + ' total entries</span></div>' +
    '</div>' +
  '</section>';
}

    : '<span style="color:var(--ink-400)">Tap a tile to log</span>';
  const profileName = ((STATE.data.profile && STATE.data.profile.name) || '').trim();

  // Eyebrow: greeting (if name) OR weekday/date
  const eyebrow = profileName
    ? (timeGreeting() + ', ' + profileName).toUpperCase()
    : (greetingSerif() + ' · ' + dateSubtitle()).toUpperCase();

  // Hero number: streak if > 0, else day-of-month
  const heroNumber = streak > 0 ? streak : (new Date()).getDate();
  const heroUnit   = streak > 0 ? (streak === 1 ? 'day' : 'days') : 'today';
  const heroSubLeft = streak > 0
    ? '<em>of</em> daily practice'
    : '<em>your</em> practice begins';
  const heroSub = '<span style="font-family:var(--serif);font-style:italic;font-size:13px;color:var(--ink-600);letter-spacing:-0.01em">' + heroSubLeft + '</span>' +
    (todayEntries.length > 0 ? '<span class="dot"></span><span>' + todayEntries.length + ' entr' + (todayEntries.length === 1 ? 'y' : 'ies') + ' today</span>' : '') +
    (profileName ? '<span class="dot"></span><span>' + escapeHTML(greetingSerif()) + '</span>' : '');

  const dateBlock = '<section class="hero">' +
    '<p class="hero__eyebrow">' + escapeHTML(eyebrow) + '</p>' +
    '<div class="hero__row"><span class="hero__num" id="hero-num">' + heroNumber + '</span>' +
      '<span class="hero__unit">' + heroUnit + '</span></div>' +
    '<p class="hero__sub">' + heroSub + '</p>' +
  '</section>';

  const hintHTML = STATE.data.entries.length === 0 ? (
    '<div class="section" style="margin-top:18px"><div class="hint">' + icon('Info',{size:14, stroke:1.4}) +
    '<span><strong>Tap</strong> a tile to log instantly · <strong>hold</strong> to start a focus session · <strong>slider</strong> icon for full details.</span></div></div>'
  ) : '';

  const tilesHTML = '<section class="section">' +
    '<div class="section__head">' +
    '<h2 class="section__title">Quick <em>log</em></h2>' +
    '<button class="section__link" data-action="nav" data-view="categories">Categories</button>' +
    '</div>' +
    '<div class="tiles">' + STATE.data.categories.map(function(c){ return categoryTile(c, todayStats); }).join('') + '</div>' +
  '</section>';

  const goalsHTML = activeGoals.length > 0 ? (
    '<section class="section">' +
    '<div class="section__head"><h2 class="section__title"><em>In</em> progress</h2>' +
    '<button class="section__link" data-action="nav" data-view="goals">All ' + icon('ArrowRight',{size:11, stroke:1.5}) + '</button></div>' +
    '<div class="stack-tight">' + activeGoals.map(goalRow).join('') + '</div>' +
    '</section>'
  ) : '';

  const todayHTML = todayEntries.length > 0 ? (
    '<section class="section">' +
    '<div class="section__head"><h2 class="section__title">Today<em>\'s</em> log</h2>' +
    '<button class="section__link" data-action="nav" data-view="log">Full log ' + icon('ArrowRight',{size:11, stroke:1.5}) + '</button></div>' +
    '<div class="stack-tight">' + todayEntries.map(function(e){ return entryRow(e); }).join('') + '</div>' +
    '</section>'
  ) : '';

  const heatmapHTML = STATE.data.entries.length > 0 ? heatmap() : '';

  return masthead + dateBlock + hintHTML + tilesHTML + todayHTML + heatmapHTML + goalsHTML + fab();
}

function viewSettings() {

  const themeSeg = ['auto','light','dark'].map(function(t){

  const body =
    '<div class="setting-section">' +
      '<h3 class="setting-section__title">your profile</h3>' +
      '<div class="setting-group">' +
        '<label class="setting-row" style="cursor:default">' +
          '<div class="setting-row__label">Name<div class="setting-row__sub">Used for your greeting on the home screen.</div></label>' +
          '<input class="name-input" id="profile-name" type="text" placeholder="Add your name" value="' + escapeHTML(profile.name||'') + '" style="max-width:50%;text-align:right"/>' +
        '</label>' +
      '</div>' +
    '</div>' +
    '<div class="setting-section">' +
      '<h3 class="setting-section__title">appearance</h3>' +
      '<div class="setting-group">' +
        '<div class="setting-row" style="cursor:default">' +
          '<div class="setting-row__label">Theme<div class="setting-row__sub">Auto follows your device.</div></div>' +
          '<div class="seg">' + themeSeg + '</div>' +
        '</div>' +
      '</div>' +
    '</div>' +
    '<div class="setting-section">' +
      '<h3 class="setting-section__title">tracking</h3>' +
      '<div class="setting-group">' +
        '<button class="setting-row" data-action="nav" data-view="categories">' +
          '<div class="setting-row__label">Categories<div class="setting-row__sub">' + totalCats + ' active · tap to manage and reorder</div></div>' +
          '<span class="setting-row__chev">' + icon('ChevronRight',{size:18, stroke:1.4}) + '</span>' +
        '</button>' +
      '</div>' +
    '</div>' +
    '<div class="setting-section">' +
      '<h3 class="setting-section__title">your data</h3>' +
      '<div class="setting-group">' +
        '<button class="setting-row" data-action="export-data">' +
          '<div class="setting-row__label">Export backup<div class="setting-row__sub">Download a JSON copy of everything.</div></div>' +
          '<span class="setting-row__chev">' + icon('ArrowRight',{size:16, stroke:1.4}) + '</span>' +
        '</button>' +
        '<button class="setting-row" data-action="import-data">' +
          '<div class="setting-row__label">Restore from backup<div class="setting-row__sub">Replace your data with a JSON file.</div></div>' +
          '<span class="setting-row__chev">' + icon('ArrowRight',{size:16, stroke:1.4}) + '</span>' +
        '</button>' +
        '<button class="setting-row" data-action="reset-data">' +

        '</button>' +
      '</div>' +
      '<p style="font-size:11px;color:var(--ink-400);margin:10px 4px 0;line-height:1.55">' +

      '</p>' +

  return header({
    title: 'Settings',

function viewLog() {
  let entries = STATE.data.entries;
  if (STATE.filterCategoryId) entries = entries.filter(function(e){ return e.categoryId === STATE.filterCategoryId; });

  const groups = {};
  entries.forEach(function(e){ if (!groups[e.date]) groups[e.date] = []; groups[e.date].push(e); });
  const sortedDates = Object.keys(groups).sort(function(a,b){ return a < b ? 1 : -1; });

  const filtersHTML = '<div class="section" style="margin-top:12px"><div class="chips chips--scroll">' +
    '<button class="chip' + (STATE.filterCategoryId === null ? ' chip--active' : '') + '" data-action="set-filter" data-cat=""' + (STATE.filterCategoryId === null ? ' style="background:var(--ink-800)"' : '') + '>All</button>' +
    STATE.data.categories.map(function(c){
      const active = STATE.filterCategoryId === c.id;
      const style = active ? ' style="background:' + c.color + '"' : '';
      return '<button class="chip' + (active ? ' chip--active' : '') + '" data-action="set-filter" data-cat="' + c.id + '"' + style + '>' +
        '<span class="icon-flex">' + icon(c.icon, {size:13, stroke:1.5}) + '</span>' + escapeHTML(c.name) +
      '</button>';
    }).join('') +
  '</div></div>';

  const listHTML = sortedDates.length === 0
    ? '<div class="section"><div class="empty"><div class="empty__icon">' + icon('ListChecks',{size:24, stroke:1.3}) + '</div><h3 class="empty__title">Nothing yet</h3><p class="empty__text">Start logging from the home screen.</p></div></div>'
    : '<div class="section">' + sortedDates.map(function(date){
        return '<div class="date-group"><h3 class="date-h">' + escapeHTML(formatDateHeader(date)) + '</h3>' +
          '<div class="stack-tight">' + groups[date].map(function(e){ return entryRow(e, {deletable:true}); }).join('') + '</div>' +
        '</div>';
      }).join('') + '</div>';

  return header({
    title: 'Log',
    subtitle: "Everything you've tracked",
    right: '<button class="btn-circle btn-circle--ghost" data-action="nav" data-view="settings" aria-label="Settings">' + icon('Settings',{size:18, stroke:1.4}) + '</button>',
  }) + filtersHTML + listHTML + fab();
}

function viewGoals() {
  const active = STATE.data.goals.filter(function(g){ return !g.archived; });
  const archived = STATE.data.goals.filter(function(g){ return g.archived; });

  let body = '';
  if (active.length === 0 && archived.length === 0) {
    body = '<div class="section"><div class="empty">' +
      '<div class="empty__icon">' + icon('Target',{size:24, stroke:1.3}) + '</div>' +
      '<h3 class="empty__title">Set your first goal</h3>' +
      '<p class="empty__text">Track progress toward something you care about.</p>' +
      '<button class="btn btn-primary" style="margin-top:18px" data-action="open-add-goal">' + icon('Plus',{size:14, stroke:1.6}) + ' New goal</button>' +
      '</div></div>';
  } else {
    if (active.length) body += '<div class="section"><div class="stack-tight">' + active.map(goalRow).join('') + '</div></div>';
    if (archived.length) body += '<div class="section"><h2 class="section__title" style="margin-bottom:10px;padding-left:4px"><em>Archived</em></h2><div class="stack-tight" style="opacity:0.6">' + archived.map(goalRow).join('') + '</div></div>';
  }

  return header({
    title: 'Goals',
    subtitle: "What you're working toward",
    right: '<button class="btn-circle" data-action="open-add-goal" aria-label="New goal">' + icon('Plus',{size:18, stroke:1.8}) + '</button>',
  }) + body;
}

function viewNotes() {
  const q = STATE.noteQuery.trim().toLowerCase();
  let list = STATE.data.notes.slice().sort(function(a,b){
    if (!!a.pinned !== !!b.pinned) return a.pinned ? -1 : 1;
    return b.updatedAt.localeCompare(a.updatedAt);
  });
  if (q) list = list.filter(function(n){ return n.title.toLowerCase().includes(q) || (n.body||'').toLowerCase().includes(q); });

  const searchHTML = '<div class="section" style="margin-top:12px"><div class="search-wrap">' +
    '<span class="icon-abs">' + icon('Search',{size:16, stroke:1.5}) + '</span>' +
    '<input class="input" id="note-search" type="text" placeholder="Search notes" value="' + escapeHTML(STATE.noteQuery) + '"/>' +
  '</div></div>';

  let body;
  if (list.length === 0) {
    body = '<div class="section"><div class="empty">' +
      '<div class="empty__icon">' + icon('NotebookPen',{size:24, stroke:1.3}) + '</div>' +
      '<h3 class="empty__title">' + (STATE.data.notes.length === 0 ? 'No notes yet' : 'No matches') + '</h3>' +
      '<p class="empty__text">' + (STATE.data.notes.length === 0 ? 'Jot down a thought, a quote, an idea.' : 'Try a different search term.') + '</p>' +
      (STATE.data.notes.length === 0 ? '<button class="btn btn-primary" style="margin-top:18px" data-action="open-new-note">' + icon('Plus',{size:14, stroke:1.6}) + ' New note</button>' : '') +
    '</div></div>';
  } else {
    body = '<div class="section"><div class="stack-tight">' + list.map(noteRow).join('') + '</div></div>';
  }

  return header({
    title: 'Notes',
    subtitle: STATE.data.notes.length + ' ' + (STATE.data.notes.length === 1 ? 'note' : 'notes'),
    right: '<button class="btn-circle" data-action="open-new-note" aria-label="New note">' + icon('Plus',{size:18, stroke:1.8}) + '</button>',
  }) + searchHTML + body;
}

function viewCategories() {
  const entriesByCat = {};
  STATE.data.entries.forEach(function(e){ entriesByCat[e.categoryId] = (entriesByCat[e.categoryId]||0) + 1; });

  const total = STATE.data.categories.length;
  const list = STATE.data.categories.map(function(c, i){
    const count = entriesByCat[c.id] || 0;
    const trackBit = c.trackValue
      ? 'Default ' + (c.defaultValue || 1) + ' ' + escapeHTML(c.unit||'')
      : 'Simple check-in';
    const upDis  = i === 0          ? ' disabled' : '';
    const dnDis  = i === total - 1  ? ' disabled' : '';
    return '<div class="cat-list-item" data-action="edit-category" data-id="' + c.id + '">' +
      '<div class="cat-list-item__icon" style="background:' + alpha(c.color, 0.07) + ';color:' + c.color + '">' + icon(c.icon, {size:20, stroke:1.4}) + '</div>' +
      '<div class="cat-list-item__body">' +
        '<p class="cat-list-item__name">' + escapeHTML(c.name) + '</p>' +
        '<p class="cat-list-item__sub">' + trackBit + (count > 0 ? ' · ' + count + ' ' + (count === 1 ? 'entry' : 'entries') : '') + '</p>' +
      '</div>' +
      '<div class="cat-list-item__reorder" data-stop="1">' +
        '<button data-action="move-category" data-id="' + c.id + '" data-dir="up" data-stop="1"' + upDis + ' aria-label="Move up">' +
          '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"/></svg>' +
        '</button>' +
        '<button data-action="move-category" data-id="' + c.id + '" data-dir="down" data-stop="1"' + dnDis + ' aria-label="Move down">' +
          '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>' +
        '</button>' +
      '</div>' +
      '<span class="cat-list-item__chev">' + icon('Pencil',{size:14, stroke:1.5}) + '</span>' +
    '</div>';
  }).join('');

  return header({
    title: 'Categories',
    subtitle: 'Tap to edit · arrows to reorder',
    back: 'settings',
    right: '<button class="btn-circle" data-action="new-category" aria-label="New category">' + icon('Plus',{size:18, stroke:1.8}) + '</button>',
  }) + '<div class="section"><div class="stack-tight">' + list + '</div>' +
  '<button class="dashed-add" data-action="new-category">' + icon('Plus',{size:14, stroke:1.6}) + ' Add category</button>' +
  '</div>';
}

   MODALS
