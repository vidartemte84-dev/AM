function modalShell(title, body) {
  return '<div class="modal-backdrop" data-action="close-modal-bg"><div class="modal" data-stop="1">' +
    '<div class="modal__head"><h2 class="modal__title">' + escapeHTML(title) + '</h2>' +
    '<button class="modal__close" data-action="close-modal" aria-label="Close">' + icon('X',{size:16, stroke:1.6}) + '</button></div>' +
    '<div class="modal__body">' + body + '</div></div></div>';
}

function modalAddEntry() {
  const d = STATE.modalData;
  const selectedCat = findCategory(d.categoryId);
  const chips = STATE.data.categories.map(function(c){
    const active = c.id === d.categoryId;
    const style = active ? ' style="background:' + c.color + '"' : '';
    return '<button class="chip' + (active ? ' chip--active' : '') + '" data-action="set-add-cat" data-cat="' + c.id + '"' + style + '>' +
      '<span class="icon-flex">' + icon(c.icon, {size:13, stroke:1.5}) + '</span>' + escapeHTML(c.name) +
    '</button>';
  }).join('');

  const valueField = selectedCat && selectedCat.trackValue ? (
    '<div class="modal__field"><label class="label">How many ' + escapeHTML(selectedCat.unit || 'units') + '?</label>' +
    '<input class="input input--big" id="entry-value" type="number" inputmode="decimal" placeholder="' + (selectedCat.defaultValue || 0) + '" value="' + escapeHTML(d.value||'') + '"/></div>'
  ) : '';

  const body = '<div class="modal__field"><label class="label">Category</label><div class="chips">' + chips + '</div></div>' +
    valueField +
    '<div class="modal__field"><label class="label">Notes <small>(optional)</small></label>' +
    '<textarea class="textarea" id="entry-note" rows="3" placeholder="How did it go?">' + escapeHTML(d.note||'') + '</textarea></div>' +
    '<div class="modal__field"><label class="label">Date</label>' +
    '<input class="input" id="entry-date" type="date" value="' + escapeHTML(d.date) + '"/></div>' +
    '<div class="modal__footer"><span></span>' +
    '<button class="btn btn-primary" style="width:100%;justify-content:center" data-action="save-entry">Save entry</button></div>';

  return modalShell('New entry', body);
}

function modalAddGoal() {
  const d = STATE.modalData;
  const catChips = '<button class="chip' + (d.categoryId === '' ? ' chip--active' : '') + '" data-action="set-goal-cat" data-cat=""' + (d.categoryId === '' ? ' style="background:var(--ink-800)"' : '') + '>None</button>' +
    STATE.data.categories.map(function(c){
      const active = d.categoryId === c.id;
      const style = active ? ' style="background:' + c.color + '"' : '';
      return '<button class="chip' + (active ? ' chip--active' : '') + '" data-action="set-goal-cat" data-cat="' + c.id + '"' + style + '>' +
        '<span class="icon-flex">' + icon(c.icon, {size:13, stroke:1.5}) + '</span>' + escapeHTML(c.name) +
      '</button>';
    }).join('');

  const periodBtns = ['day','week','month'].map(function(p){
    return '<button class="' + (d.period === p ? 'active' : '') + '" data-action="set-goal-period" data-period="' + p + '">' + p.charAt(0).toUpperCase() + p.slice(1) + '</button>';
  }).join('');

  const body = '<div class="modal__field"><label class="label">Title</label>' +
    '<input class="input" id="goal-title" type="text" placeholder="e.g., Run 30 km this week" value="' + escapeHTML(d.title) + '"/></div>' +
    '<div class="modal__field"><label class="label">Linked category <small>(optional)</small></label><div class="chips">' + catChips + '</div></div>' +
    '<div class="modal__field modal__row"><div><label class="label">Target</label><input class="input input--big" id="goal-target" type="number" inputmode="decimal" placeholder="0" value="' + escapeHTML(d.target) + '"/></div>' +
    '<div><label class="label">Unit</label><input class="input" id="goal-unit" type="text" placeholder="words" value="' + escapeHTML(d.unit) + '"/></div></div>' +
    '<div class="modal__field"><label class="label">Per</label><div class="period-grid">' + periodBtns + '</div></div>' +
    '<div class="modal__footer"><span></span><button class="btn btn-primary" style="width:100%;justify-content:center" data-action="save-goal">Save goal</button></div>';

  return modalShell('New goal', body);
}

function modalEditNote() {
  const d = STATE.modalData;
  const isExisting = STATE.data.notes.some(function(n){ return n.id === d.id; });
  const body = '<input class="input" id="note-title" type="text" placeholder="Title" value="' + escapeHTML(d.title) + '" style="background:transparent;border-radius:0;border-bottom:1px solid var(--ink-100);border-top:0;border-left:0;border-right:0;font-family:var(--serif);font-size:24px;font-weight:500;letter-spacing:-0.02em;padding:8px 4px;margin-top:0"/>' +
    '<textarea class="textarea" id="note-body" rows="10" placeholder="Start writing…" style="background:transparent;padding:12px 4px;line-height:1.65;margin-top:8px;font-size:15px;color:var(--ink-700)">' + escapeHTML(d.body) + '</textarea>' +
    '<div class="modal__footer">' +
    (isExisting ? '<button class="btn-danger" style="display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:13px" data-action="delete-note" data-id="' + d.id + '">' + icon('Trash2',{size:14, stroke:1.5}) + ' Delete</button>' : '<span></span>') +
    '<button class="btn btn-primary" data-action="close-modal">Save</button></div>';
  return modalShell(isExisting ? 'Edit note' : 'New note', body);
}

function modalEditCategory() {
  const d = STATE.modalData;
  const isExisting = STATE.data.categories.some(function(c){ return c.id === d.id; });

  const swatches = CATEGORY_COLORS.map(function(col){
    const sel = col === d.color;
    return '<button class="swatch" data-action="set-cat-color" data-color="' + col + '" style="background:' + col + (sel ? ';outline:2px solid ' + col + ';outline-offset:2px' : '') + '" aria-label="' + col + '">' +
      (sel ? icon('Check', {size:16, stroke:3}) : '') + '</button>';
  }).join('');

  const iconGrid = CATEGORY_ICONS.map(function(ic){
    const sel = ic === d.icon;
    const style = sel ? ' style="background:' + d.color + ';color:var(--on-ink)"' : '';
    return '<button class="' + (sel ? 'active' : '') + '" data-action="set-cat-icon" data-icon="' + ic + '"' + style + '>' + icon(ic, {size:18, stroke:1.4}) + '</button>';
  }).join('');

  const valueFields = d.trackValue ? (
    '<div class="modal__field modal__row">' +
    '<div><label class="label">Unit</label><input class="input" id="cat-unit" type="text" placeholder="minutes" value="' + escapeHTML(d.unit||'') + '"/></div>' +
    '<div><label class="label">Default <small>(one-tap)</small></label><input class="input" id="cat-default" type="number" inputmode="decimal" placeholder="30" value="' + escapeHTML(d.defaultValue || '') + '"/></div>' +
    '</div>'
  ) : '';

  const body = '<div class="preview"><div class="preview__icon" style="background:' + alpha(d.color, 0.10) + ';color:' + d.color + '">' + icon(d.icon, {size:22, stroke:1.4}) + '</div>' +
    '<div><p class="preview__name">' + escapeHTML(d.name || 'Untitled') + '</p>' +
    '<p class="preview__sub">' + (d.trackValue ? 'Default ' + (d.defaultValue || 0) + ' ' + escapeHTML(d.unit||'value') + ' per tap' : 'Simple check-in') + '</p></div></div>' +
    '<div class="modal__field"><label class="label">Name</label><input class="input" id="cat-name" type="text" placeholder="e.g., Meditation" value="' + escapeHTML(d.name) + '"/></div>' +
    '<div class="modal__field"><label class="label">Color</label><div class="swatches">' + swatches + '</div></div>' +
    '<div class="modal__field"><label class="label">Icon</label><div class="icongrid">' + iconGrid + '</div></div>' +
    '<div class="modal__field"><label class="label">Type</label><div class="toggle-grid">' +
    '<button class="' + (d.trackValue ? 'active' : '') + '" data-action="set-cat-type" data-type="value">Track a number</button>' +
    '<button class="' + (!d.trackValue ? 'active' : '') + '" data-action="set-cat-type" data-type="checkin">Just check in</button></div></div>' +
    valueFields +
    '<div class="modal__footer">' +
    (isExisting ? '<button class="btn-danger" style="display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:13px" data-action="delete-category" data-id="' + d.id + '">' + icon('Trash2',{size:14, stroke:1.5}) + ' Delete</button>' : '<span></span>') +
    '<button class="btn btn-primary" data-action="save-category">' + (isExisting ? 'Save changes' : 'Create category') + '</button></div>';

  return modalShell(isExisting ? 'Edit category' : 'New category', body);
}

/* ============================================================
   RENDER
   ============================================================ */
function render() {
  let viewHTML = '';
  switch (STATE.view) {
    case 'log':        viewHTML = viewLog(); break;
    case 'goals':      viewHTML = viewGoals(); break;
    case 'notes':      viewHTML = viewNotes(); break;
    case 'categories': viewHTML = viewCategories(); break;
    case 'settings':   viewHTML = viewSettings(); break;
    case 'home':
    default:           STATE.view = 'home'; viewHTML = viewHome(); break;
  }

  let modalHTML = '';
  if (STATE.modal === 'add-entry')      modalHTML = modalAddEntry();
  else if (STATE.modal === 'add-goal')  modalHTML = modalAddGoal();
  else if (STATE.modal === 'edit-note') modalHTML = modalEditNote();
  else if (STATE.modal === 'edit-category') modalHTML = modalEditCategory();

  const focusHTML = STATE.focus ? viewFocus() : '';

  document.getElementById('app').innerHTML =
    '<div class="app">' + viewHTML + '</div>' +
    nav() +
    modalHTML +
    focusHTML;
}

/* ============================================================
   NOTE SAVE HELPERS
   ============================================================ */
function readNoteFromInputs() {
  if (STATE.modal !== 'edit-note' || !STATE.modalData) return;
  const t = document.getElementById('note-title');
  const b = document.getElementById('note-body');
  if (t) STATE.modalData.title = t.value;
  if (b) STATE.modalData.body  = b.value;
}
function saveCurrentNote() {
  if (!STATE.modalData) return;
  readNoteFromInputs();
  const d = STATE.modalData;
  const title = (d.title || '').trim();
  const body  = (d.body  || '').trim();
  if (!title && !body) return;
  const isExisting = STATE.data.notes.some(function(n){ return n.id === d.id; });
  const note = {
    id: d.id, title: title || 'Untitled', body: body,
    pinned: !!d.pinned,
    createdAt: d.createdAt || new Date().toISOString(),
    updatedAt: new Date().toISOString(),
  };
  if (isExisting) {
    STATE.data.notes = STATE.data.notes.map(function(n){ return n.id === note.id ? note : n; });
  } else {
    STATE.data.notes = [note].concat(STATE.data.notes);
  }
  saveData();
}

/* ============================================================
   ANIMATION HELPERS
   ============================================================ */
function animateNumber(el, from, to, duration) {
  if (!el) return;
  duration = duration || 520;
  const start = performance.now();
  function tick(now) {
    const t = Math.min(1, (now - start) / duration);
    const eased = 1 - Math.pow(1 - t, 3);
    const v = Math.round(from + (to - from) * eased);
    el.textContent = v;
    if (t < 1) requestAnimationFrame(tick);
  }
  el.classList.remove('num-pop');
  void el.offsetWidth;
  el.classList.add('num-pop');
  requestAnimationFrame(tick);
}

/* ============================================================
   QUICK LOG (one-tap)
   ============================================================ */
function quickLog(categoryId, tileEl) {
  const cat = findCategory(categoryId);
  if (!cat) return;
  const value = cat.trackValue ? (cat.defaultValue || 1) : undefined;
  // capture before-state for animation
  const before = todayTotalsByCat()[cat.id] || { total: 0, count: 0 };
  const fromVal = cat.trackValue ? before.total : before.count;
  const toVal   = cat.trackValue ? (before.total + (value || 0)) : (before.count + 1);
  STATE.pendingAnimate = { catId: cat.id, from: fromVal, to: toVal };

  const entry = {
    id: uid(),
    categoryId: cat.id,
    date: todayISO(),
    value: value,
    createdAt: new Date().toISOString(),
  };
  STATE.data.entries = [entry].concat(STATE.data.entries);
  STATE.lastEntryId = entry.id;
  saveData();
  // pulse the tile
  if (tileEl) {
    tileEl.classList.remove('pulse');
    void tileEl.offsetWidth;
    tileEl.classList.add('pulse');
  }
  // delay render slightly so the pulse can play before re-rendering wipes it
  setTimeout(function() {
    render();
    // animate the tile number after re-render
    if (STATE.pendingAnimate) {
      const pa = STATE.pendingAnimate;
      STATE.pendingAnimate = null;
      const sel = '.tile[data-cat="' + pa.catId + '"] .tile__num';
      const el = document.querySelector(sel);
      if (el) animateNumber(el, pa.from, pa.to);
    }
  }, 300);
  // show toast with undo
  const valueLabel = cat.trackValue ? (value + ' ' + (cat.unit || '')) : 'check-in';
  showToast(
    '<div class="toast__dot" style="background:' + cat.color + '"></div>' +
    '<div class="toast__msg"><strong>+' + escapeHTML(valueLabel) + '</strong> <span>· ' + escapeHTML(cat.name) + '</span></div>' +
    '<button class="toast__action" data-action="undo-quick-log">Undo</button>',
    { duration: 3500 }
  );
}

/* ============================================================
   FOCUS MODE — long-press a tile to enter
   ============================================================ */
function enterFocus(catId) {
  const cat = findCategory(catId);
  if (!cat) return;
  STATE.focus = { catId: cat.id, startTime: Date.now() };
  render();
  if (STATE.focusInterval) clearInterval(STATE.focusInterval);
  STATE.focusInterval = setInterval(updateFocusTime, 1000);
  updateFocusTime();
}

function updateFocusTime() {
  if (!STATE.focus) return;
  const el = document.getElementById('focus-time');
  if (!el) return;
  const sec = Math.floor((Date.now() - STATE.focus.startTime) / 1000);
  const h = Math.floor(sec / 3600);
  const m = Math.floor((sec % 3600) / 60);
  const s = sec % 60;
  el.textContent = (h > 0 ? h + ':' + String(m).padStart(2,'0') : m) + ':' + String(s).padStart(2,'0');
}

function exitFocus(save) {
  if (!STATE.focus) return;
  if (STATE.focusInterval) { clearInterval(STATE.focusInterval); STATE.focusInterval = null; }
  const f = STATE.focus;
  STATE.focus = null;
  if (save) {
    const elapsedSec = Math.round((Date.now() - f.startTime) / 1000);
    const minutes = Math.max(1, Math.round(elapsedSec / 60));
    const cat = findCategory(f.catId);
    if (cat) {
      const before = todayTotalsByCat()[cat.id] || { total: 0, count: 0 };
      const fromVal = cat.trackValue ? before.total : before.count;
      const toVal   = cat.trackValue ? (before.total + minutes) : (before.count + 1);
      STATE.pendingAnimate = { catId: cat.id, from: fromVal, to: toVal };

      const entry = {
        id: uid(),
        categoryId: cat.id,
        date: todayISO(),
        value: cat.trackValue ? minutes : undefined,
        note: 'Focus session',
        createdAt: new Date().toISOString(),
      };
      STATE.data.entries = [entry].concat(STATE.data.entries);
      STATE.lastEntryId = entry.id;
      saveData();
      render();
      // animate
      setTimeout(function() {
        if (STATE.pendingAnimate) {
          const pa = STATE.pendingAnimate;
          STATE.pendingAnimate = null;
          const el = document.querySelector('.tile[data-cat="' + pa.catId + '"] .tile__num');
          if (el) animateNumber(el, pa.from, pa.to);
        }
      }, 50);
      const unit = cat.trackValue ? (cat.unit || 'minutes') : 'check-in';
      showToast(
        '<div class="toast__dot" style="background:' + cat.color + '"></div>' +
        '<div class="toast__msg"><strong>' + minutes + ' ' + escapeHTML(unit) + '</strong> <span>· ' + escapeHTML(cat.name) + ' · focus session</span></div>' +
        '<button class="toast__action" data-action="undo-quick-log">Undo</button>',
        { duration: 3800 }
      );
      return;
    }
  }
  render();
}

function viewFocus() {
  const f = STATE.focus;
  const cat = findCategory(f.catId);
  if (!cat) return '';
  return '<div class="focus" style="background:' + cat.color + '" data-action="noop">' +
    '<div class="focus__inner">' +
      '<p class="focus__cat"><span class="focus__cat-dot"></span>' + escapeHTML(cat.name).toUpperCase() + '</p>' +
      '<p class="focus__time" id="focus-time">0:00</p>' +
      '<p class="focus__hint">FOCUS SESSION · TIME AUTO-LOGS WHEN YOU STOP</p>' +
      '<div class="focus__actions">' +
        '<button class="focus__btn" data-action="exit-focus" data-save="0">Cancel</button>' +
        '<button class="focus__btn focus__btn--primary" data-action="exit-focus" data-save="1">Stop & log</button>' +
      '</div>' +
    '</div>' +
  '</div>';
}

/* ============================================================
   EVENT HANDLERS
   ============================================================ */
/* LONG-PRESS detection on category tiles → enter focus mode */
let _lpTimer = null, _lpStart = null, _lpFired = false, _lpTarget = null;
function _clearLP() {
  if (_lpTimer) clearTimeout(_lpTimer);
  _lpTimer = null; _lpStart = null; _lpTarget = null;
}
document.addEventListener('pointerdown', function(e) {
  const tile = e.target.closest('.tile[data-action="quick-log"]');
  if (!tile) return;
  _lpTarget = tile;
  _lpStart = { x: e.clientX, y: e.clientY };
  _lpFired = false;
  _lpTimer = setTimeout(function() {
    if (_lpTarget === tile) {
      _lpFired = true;
      if (navigator.vibrate) navigator.vibrate(18);
      enterFocus(tile.dataset.cat);
    }
  }, 500);
});
document.addEventListener('pointerup',     _clearLP);
document.addEventListener('pointercancel', _clearLP);
document.addEventListener('pointerleave',  _clearLP);
document.addEventListener('pointermove', function(e) {
  if (!_lpStart) return;
  const dx = e.clientX - _lpStart.x, dy = e.clientY - _lpStart.y;
  if (dx*dx + dy*dy > 100) _clearLP(); // moved > 10px
});
/* prevent the iOS contextmenu / callout on long-press of tiles */
document.addEventListener('contextmenu', function(e) {
  if (e.target.closest('.tile[data-action="quick-log"]')) e.preventDefault();
});

document.addEventListener('click', function(ev) {
  // swallow the click that ends a long-press
  if (_lpFired) {
    _lpFired = false;
    ev.preventDefault();
    ev.stopPropagation();
    return;
  }
  // honor data-stop="1" first so child buttons don't fall through to parent .tile
  let stopEl = ev.target.closest('[data-stop]');
  let target = ev.target.closest('[data-action]');
  if (!target) return;

  // If we clicked a data-stop element, only honor its own action — don't bubble.
  if (stopEl && stopEl !== target && stopEl.contains(target)) {
    // ambiguous — proceed with target
  }
  // If target has a parent .tile and target itself has data-stop, prevent quick-log
  const action = target.dataset.action;

  if (action === 'close-modal-bg') {
    if (ev.target === target) closeModal();
    return;
  }
  if (action === 'close-modal') { closeModal(); return; }

  if (action === 'nav') { setView(target.dataset.view); return; }

  if (action === 'set-filter') {
    STATE.filterCategoryId = target.dataset.cat || null;
    render(); return;
  }

  if (action === 'quick-log') {
    ev.preventDefault();
    quickLog(target.dataset.cat, target);
    return;
  }
  if (action === 'exit-focus') {
    exitFocus(target.dataset.save === '1');
    return;
  }
  if (action === 'noop') {
    return;
  }
  if (action === 'undo-quick-log') {
    ev.stopPropagation();
    if (STATE.lastEntryId) {
      STATE.data.entries = STATE.data.entries.filter(function(e){ return e.id !== STATE.lastEntryId; });
      STATE.lastEntryId = null;
      saveData();
      hideToast();
      render();
    }
    return;
  }

  if (action === 'open-add-entry') {
    ev.stopPropagation();
    const catId = target.dataset.cat || STATE.filterCategoryId || (STATE.data.categories[0] && STATE.data.categories[0].id) || '';
    openModal('add-entry', { categoryId: catId, value: '', note: '', date: todayISO() });
    return;
  }
  if (action === 'set-add-cat') {
    if (STATE.modalData) { STATE.modalData.categoryId = target.dataset.cat; }
    const v = document.getElementById('entry-value'); if (v) STATE.modalData.value = v.value;
    const n = document.getElementById('entry-note');  if (n) STATE.modalData.note  = n.value;
    const dt= document.getElementById('entry-date');  if (dt)STATE.modalData.date  = dt.value;
    render();
    return;
  }
  if (action === 'save-entry') {
    const d = STATE.modalData;
    const v = document.getElementById('entry-value');
    const n = document.getElementById('entry-note');
    const dt= document.getElementById('entry-date');
    if (v) d.value = v.value;
    if (n) d.note  = n.value;
    if (dt)d.date  = dt.value;
    const cat = findCategory(d.categoryId);
    if (!cat) return;
    let numVal = d.value === '' || d.value == null ? undefined : Number(d.value);
    if (cat.trackValue && (numVal === undefined || isNaN(numVal))) {
      numVal = cat.defaultValue || undefined;
    }
    const trimmedNote = (d.note || '').trim();
    const entry = {
      id: uid(),
      categoryId: cat.id,
      date: d.date || todayISO(),
      value: numVal,
      note: trimmedNote || undefined,
      createdAt: new Date().toISOString(),
    };
    STATE.data.entries = [entry].concat(STATE.data.entries);
    saveData();
    closeModal();
    return;
  }
  if (action === 'delete-entry') {
    STATE.data.entries = STATE.data.entries.filter(function(e){ return e.id !== target.dataset.id; });
    saveData(); render();
    return;
  }

  /* GOALS */
  if (action === 'open-add-goal') {
    openModal('add-goal', { title:'', categoryId:'', target:'', unit:'', period:'week' });
    return;
  }
  if (action === 'set-goal-cat') {
    const t = document.getElementById('goal-title');  if (t) STATE.modalData.title  = t.value;
    const tg= document.getElementById('goal-target'); if (tg)STATE.modalData.target = tg.value;
    const u = document.getElementById('goal-unit');   if (u) STATE.modalData.unit   = u.value;
    STATE.modalData.categoryId = target.dataset.cat;
    if (!STATE.modalData.unit) {
      const cat = findCategory(target.dataset.cat);
      if (cat && cat.unit) STATE.modalData.unit = cat.unit;
    }
    render(); return;
  }
  if (action === 'set-goal-period') {
    const t = document.getElementById('goal-title');  if (t) STATE.modalData.title  = t.value;
    const tg= document.getElementById('goal-target'); if (tg)STATE.modalData.target = tg.value;
    const u = document.getElementById('goal-unit');   if (u) STATE.modalData.unit   = u.value;
    STATE.modalData.period = target.dataset.period;
    render(); return;
  }
  if (action === 'save-goal') {
    const d = STATE.modalData;
    const t = document.getElementById('goal-title');  if (t) d.title  = t.value;
    const tg= document.getElementById('goal-target'); if (tg)d.target = tg.value;
    const u = document.getElementById('goal-unit');   if (u) d.unit   = u.value;
    const title = (d.title||'').trim();
    const targ = Number(d.target);
    if (!title || !targ || isNaN(targ)) return;
    const cat = findCategory(d.categoryId);
    const goal = {
      id: uid(), title: title,
      categoryId: d.categoryId || undefined,
      target: targ,
      unit: (d.unit||'').trim() || (cat && cat.unit) || 'entries',
      period: d.period, createdAt: new Date().toISOString(),
    };
    STATE.data.goals = [goal].concat(STATE.data.goals);
    saveData(); closeModal(); return;
  }
  if (action === 'archive-goal') {
    STATE.data.goals = STATE.data.goals.map(function(g){ return g.id === target.dataset.id ? Object.assign({}, g, { archived: !g.archived }) : g; });
    saveData(); render(); return;
  }
  if (action === 'delete-goal') {
    STATE.data.goals = STATE.data.goals.filter(function(g){ return g.id !== target.dataset.id; });
    saveData(); render(); return;
  }

  /* NOTES */
  if (action === 'open-new-note') {
    openModal('edit-note', { id: uid(), title:'', body:'', pinned:false, createdAt:new Date().toISOString(), updatedAt:new Date().toISOString() });
    return;
  }
  if (action === 'edit-note') {
    const n = STATE.data.notes.find(function(x){ return x.id === target.dataset.id; });
    if (n) openModal('edit-note', Object.assign({}, n));
    return;
  }
  if (action === 'toggle-pin') {
    ev.stopPropagation();
    STATE.data.notes = STATE.data.notes.map(function(n){ return n.id === target.dataset.id ? Object.assign({}, n, { pinned: !n.pinned, updatedAt: new Date().toISOString() }) : n; });
    saveData(); render(); return;
  }
  if (action === 'delete-note') {
    STATE.data.notes = STATE.data.notes.filter(function(n){ return n.id !== target.dataset.id; });
    saveData();
    STATE.modal = null; STATE.modalData = null;
    render(); return;
  }

  /* CATEGORIES */
  if (action === 'new-category') {
    openModal('edit-category', { id: uid(), name:'', icon: CATEGORY_ICONS[0],
      color: CATEGORY_COLORS[Math.floor(Math.random()*CATEGORY_COLORS.length)],
      unit:'', defaultValue: '', trackValue:true });
    return;
  }
  if (action === 'edit-category') {
    const c = findCategory(target.dataset.id);
    if (c) openModal('edit-category', Object.assign({ defaultValue: '' }, c));
    return;
  }
  if (action === 'set-cat-color') {
    const n = document.getElementById('cat-name'); if (n) STATE.modalData.name = n.value;
    const u = document.getElementById('cat-unit'); if (u) STATE.modalData.unit = u.value;
    const dv= document.getElementById('cat-default'); if (dv) STATE.modalData.defaultValue = dv.value;
    STATE.modalData.color = target.dataset.color;
    render(); return;
  }
  if (action === 'set-cat-icon') {
    const n = document.getElementById('cat-name'); if (n) STATE.modalData.name = n.value;
    const u = document.getElementById('cat-unit'); if (u) STATE.modalData.unit = u.value;
    const dv= document.getElementById('cat-default'); if (dv) STATE.modalData.defaultValue = dv.value;
    STATE.modalData.icon = target.dataset.icon;
    render(); return;
  }
  if (action === 'set-cat-type') {
    const n = document.getElementById('cat-name'); if (n) STATE.modalData.name = n.value;
    const u = document.getElementById('cat-unit'); if (u) STATE.modalData.unit = u.value;
    const dv= document.getElementById('cat-default'); if (dv) STATE.modalData.defaultValue = dv.value;
    STATE.modalData.trackValue = target.dataset.type === 'value';
    render(); return;
  }
  if (action === 'save-category') {
    const d = STATE.modalData;
    const n = document.getElementById('cat-name'); if (n) d.name = n.value;
    const u = document.getElementById('cat-unit'); if (u) d.unit = u.value;
    const dv= document.getElementById('cat-default'); if (dv) d.defaultValue = dv.value;
    const name = (d.name||'').trim();
    if (!name) return;
    const defNum = d.defaultValue === '' || d.defaultValue == null ? undefined : Number(d.defaultValue);
    const next = {
      id: d.id, name: name, icon: d.icon, color: d.color,
      unit: d.trackValue ? ((d.unit||'').trim() || undefined) : undefined,
      defaultValue: d.trackValue ? (isNaN(defNum) ? 1 : defNum) : undefined,
      trackValue: d.trackValue,
    };
    const exists = STATE.data.categories.some(function(c){ return c.id === d.id; });
    STATE.data.categories = exists
      ? STATE.data.categories.map(function(c){ return c.id === d.id ? next : c; })
      : STATE.data.categories.concat([next]);
    saveData(); closeModal(); return;
  }
  if (action === 'delete-category') {
    STATE.data.categories = STATE.data.categories.filter(function(c){ return c.id !== target.dataset.id; });
    saveData();
    STATE.modal = null; STATE.modalData = null;
    render(); return;
  }
  if (action === 'move-category') {
    ev.stopPropagation();
    const id = target.dataset.id;
    const dir = target.dataset.dir;
    const i = STATE.data.categories.findIndex(function(c){ return c.id === id; });
    if (i < 0) return;
    const j = dir === 'up' ? i - 1 : i + 1;
    if (j < 0 || j >= STATE.data.categories.length) return;
    const arr = STATE.data.categories.slice();
    const tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
    STATE.data.categories = arr;
    saveData(); render(); return;
  }

  /* SETTINGS */
  if (action === 'set-theme') {
    STATE.data.profile = Object.assign({}, STATE.data.profile || DEFAULT_PROFILE, { theme: target.dataset.theme });
    saveData();
    applyTheme();
    render();
    return;
  }
  if (action === 'export-data') {
    const blob = new Blob([JSON.stringify(STATE.data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const stamp = new Date().toISOString().slice(0,10);
    a.href = url; a.download = 'trace-backup-' + stamp + '.json';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
    showToast(
      '<div class="toast__dot" style="background:#10b981"></div>' +
      '<div class="toast__msg"><strong>Backup saved</strong> <span>· check your downloads</span></div>',
      { duration: 2800 }
    );
    return;
  }
  if (action === 'import-data') {
    const inp = document.getElementById('import-file');
    if (inp) inp.click();
    return;
  }
  if (action === 'reset-data') {
    if (!confirm('Reset all entries, goals, notes, and categories? This cannot be undone.')) return;
    STATE.data = { profile: STATE.data.profile, categories: DEFAULT_CATEGORIES, entries: [], goals: [], notes: [] };
    saveData(); render();
    showToast(
      '<div class="toast__dot" style="background:var(--red)"></div>' +
      '<div class="toast__msg"><strong>Reset complete</strong> <span>· starting fresh</span></div>',
      { duration: 2500 }
    );
    return;
  }
});

/* import file handler */
document.addEventListener('change', function(ev) {
  if (ev.target && ev.target.id === 'import-file') {
    const file = ev.target.files && ev.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function() {
      try {
        const parsed = JSON.parse(reader.result);
        if (typeof parsed !== 'object' || !parsed) throw new Error('bad shape');
        STATE.data = {
          profile:    Object.assign({}, DEFAULT_PROFILE, parsed.profile || STATE.data.profile),
          categories: (parsed.categories && parsed.categories.length) ? parsed.categories : DEFAULT_CATEGORIES,
          entries:    Array.isArray(parsed.entries) ? parsed.entries : [],
          goals:      Array.isArray(parsed.goals)   ? parsed.goals   : [],
          notes:      Array.isArray(parsed.notes)   ? parsed.notes   : [],
        };
        saveData(); applyTheme(); render();
        showToast(
          '<div class="toast__dot" style="background:#10b981"></div>' +
          '<div class="toast__msg"><strong>Restored</strong> <span>· ' + STATE.data.entries.length + ' entries loaded</span></div>',
          { duration: 2800 }
        );
      } catch(e) {
        alert('That doesn\'t look like a valid Trace backup file.');
      }
    };
    reader.readAsText(file);
    ev.target.value = '';
  }
});

/* live save profile name as user types */
document.addEventListener('input', function(ev) {
  if (ev.target && ev.target.id === 'profile-name') {
    STATE.data.profile = Object.assign({}, STATE.data.profile || DEFAULT_PROFILE, { name: ev.target.value });
    saveData();
    // don't re-render on every keystroke; user is still typing
  }
});

/* live search on notes */
document.addEventListener('input', function(ev) {

    STATE.noteQuery = ev.target.value;
    render();
    const inp = document.getElementById('note-search');
    if (inp) { inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }
  }

/* persist note edits as the user types */
document.addEventListener('input', function(ev) {
  if (STATE.modal !== 'edit-note' || !STATE.modalData) return;
  if (ev.target.id === 'note-title') STATE.modalData.title = ev.target.value;
  if (ev.target.id === 'note-body')  STATE.modalData.body  = ev.target.value;
});

window.addEventListener('hashchange', function() {
  STATE.view = location.hash.replace('#','') || 'home';
  render();
});

/* react to OS theme changes when user is on 'auto' */
if (window.matchMedia) {
  const mq = window.matchMedia('(prefers-color-scheme: dark)');
  const onChange = function() {
    if (!STATE.data.profile || STATE.data.profile.theme === 'auto') applyTheme();
  };
  if (mq.addEventListener) mq.addEventListener('change', onChange);
  else if (mq.addListener) mq.addListener(onChange);
}

/* register service worker — network-first so reloads always get fresh */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function() {
    navigator.serviceWorker.register('./sw.js').then(function(reg) {
      if (reg && reg.update) reg.update();
    }).catch(function(){});
  });
}

applyTheme();
render();
</script>
</body>
</html>
